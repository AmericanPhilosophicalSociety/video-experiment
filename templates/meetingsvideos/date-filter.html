<h4>Filter by date:</h4>
<div class="input-group" id="date-filter">
  <input type="number" name="start" class="form-select" min="{{ start.date__min|date:"Y" }}" max="{{ end.date__max|date:"Y" }}" placeholder="{{ start.date__min|date:"Y"}}" id="id_start">
  <span class="input-group-text">→</span>
  <input type="number" name="end" class="form-select" min="{{ start.date__min|date:"Y" }}" max="{{ end.date__max|date:"Y" }}" placeholder="{{ end.date__max|date:"Y"}}" id="id_end">
  <button type="submit" id="date-submit" class="btn btn-primary">Apply</button>
</div>
